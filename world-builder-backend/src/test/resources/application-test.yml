spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/worldbuilder_db_test
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: worldbuilder

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

  sql:
    init:
      mode: always
      continue-on-error: true

  test:
    database:
      replace: none

jwt:
  private-key: classpath:keys/private.pem
  public-key: classpath:keys/public.pem

logging:
  level:
    root: WARN